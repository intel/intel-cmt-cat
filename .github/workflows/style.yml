name: github/style

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
permissions:  # added using https://github.com/step-security/secure-repo
  contents: read

jobs:
  style:
    # The image is left to move, and the formatter is what is named: the version
    # of clang-format decides how .clang-format is applied, so the package is
    # asked for by version below. clang-format-18 is in the archive of both
    # Ubuntu releases in use (24.04 and 26.04), so an image change does not take
    # it away, and if one ever does the install step fails with the version in
    # the message - which is what the clang-format-11 this job used to ask for
    # does today - rather than the gate quietly formatting with another version.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
    - name: Install dependencies
      run: |
        sudo apt install clang-format-18 codespell wget git python3-pip
        python3 -m pip install --upgrade pip
        pip install pipenv
        make setup-dev
        wget -P /tmp/ https://raw.githubusercontent.com/torvalds/linux/184b8f7f91ca7938c09533df83ce84817e682975/scripts/checkpatch.pl && chmod a+x /tmp/checkpatch.pl
        wget -P /tmp/ https://raw.githubusercontent.com/torvalds/linux/184b8f7f91ca7938c09533df83ce84817e682975/scripts/spelling.txt
        wget -P /tmp/ https://raw.githubusercontent.com/torvalds/linux/184b8f7f91ca7938c09533df83ce84817e682975/scripts/const_structs.checkpatch
    - name: Style check
      run: |
        clang-format-18 --version
        make style CLANGFORMAT=clang-format-18 CHECKPATCH=/tmp/checkpatch.pl
