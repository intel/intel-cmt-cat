name: github/build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:  # added using https://github.com/step-security/secure-repo
  contents: read

jobs:
  build-gcc:
    name: Build with gcc
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
    - name: Install Dependencies
      run: sudo apt install gcc
    - name: Build gcc
      run: make
    - name: Rebuild on new options
      run: |
        test -x pqos/pqos
        make DEBUG=y
        nm -D --undefined-only lib/libpqos.so | grep -w __assert_fail
        nm -D --undefined-only pqos/pqos | grep -w __assert_fail
        make SHARED=n
        if ldd pqos/pqos | grep -q libpqos; then
          echo "pqos still needs libpqos after SHARED=n"
          exit 1
        fi
        make
        ldd pqos/pqos | grep -q libpqos
    - name: Install
      run: sudo make install
    - name: Build gcc debug
      run: make DEBUG=y clean all


  build-clang:
    name: Build with clang
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
    - name: Install Dependencies
      run: sudo apt install clang
    - name: Build clang
      run: CC=clang make clean all


  scan-build:
    name: scan-build - Clang static analyzer
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
    - name: Install Dependencies
      run: sudo apt install clang-tools
    - name: Scan Build
      run: scan-build --status-bugs make



